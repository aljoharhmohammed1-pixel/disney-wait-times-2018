<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disney World Wait Times 2018</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css">
<style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}#loading{padding:32px;color:#253f50}#error{display:none;padding:24px;color:#8c2633}</style>
</head>
<body>
<div id="loading">Loading Disney World Wait Times 2018. The first visit may take a minute.</div>
<div id="error" role="alert"></div>
<div id="root"></div>
<script type="module">
try {
  const { mount } = await import("https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js");
  mount({
    requirements: ["pandas"],
    entrypoint: "app.py",
    files: {
      "app.py": {url: "./app.py"},
      "clean_data.csv": {url: "./clean_data.csv"}
    },
    streamlitConfig: {
      "theme.base": "light",
      "theme.primaryColor": "#287f89",
      "client.toolbarMode": "viewer"
    }
  }, document.getElementById("root"));
  document.getElementById("loading").remove();
} catch (error) {
  document.getElementById("loading").remove();
  const message = document.getElementById("error");
  message.style.display = "block";
  message.textContent = "The dashboard could not load. Please refresh the page or try another browser. " + error.message;
}
</script>
</body>
</html>
